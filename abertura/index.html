  /* Subtle dark scrim + technical grid over B-roll (drops to 0 on face relances) */

    pointer-events: none;

  #ambient-glow {
    position: absolute;
    width: 1100px;
    height: 1100px;
    left: 410px;

  .hud-br { bottom: 38px; right: 44px; border-width: 0 4px 4px 0; }

  #hud-tag {

    font-weight: 800;

  .promise-num.green {

  .promise-lbl {

  .chip-row {

<body>
<div id="stage">
  <div id="bg-wash"></div>
  <div id="bg-grid"></div>
  <div id="ambient-glow"></div>

  <div id="scene-root"></div>

  <div id="hud">
    <div class="hud-corner hud-tl"></div>
    <div class="hud-corner hud-tr"></div>
    <div class="hud-corner hud-bl"></div>
    <div class="hud-corner hud-br"></div>
    <div id="hud-tag"><span id="hud-dot"></span><span>IA ANTONY · EP 01</span></div>
    <div id="hud-counter">00:00</div>
    <div id="progress-track"><div id="progress-fill"></div></div>
  </div>

  <div id="flash-layer"></div>
  <div id="sweep-bar"></div>
</div>

<script>
(function () {
  const OPENING_DUR = 111.0;

  // Relances curtos do rosto (espelhado) — sincronizados com build.py
  const RELANCES = [
    [7.60, 9.55],
    [14.30, 16.20],
    [63.65, 65.55]
  ];

  // Timestamps de transições com flash/sweep (a cada 2–4s)
  const FLASH_BEATS = [
    { t: 0.08, color: '#FF7A1A', kind: 'sweep' },
    { t: 2.16, color: '#FFFFFF', kind: 'pulse' },
    { t: 4.75, color: '#FF453A', kind: 'impact' },
    { t: 5.18, color: '#FF7A1A', kind: 'sweep' },
    { t: 6.40, color: '#2BD576', kind: 'impact' },
    { t: 7.60, color: '#FF453A', kind: 'sweep' },
    { t: 9.55, color: '#FF7A1A', kind: 'sweep' },
    { t: 12.54, color: '#FF7A1A', kind: 'pulse' },
    { t: 14.30, color: '#FFFFFF', kind: 'sweep' },
    { t: 16.20, color: '#FF7A1A', kind: 'sweep' },
    { t: 20.44, color: '#FF7A1A', kind: 'pulse' },
    { t: 24.98, color: '#FF7A1A', kind: 'sweep' },
    { t: 28.92, color: '#FF7A1A', kind: 'sweep' },
    { t: 31.65, color: '#2BD576', kind: 'sweep' },
    { t: 36.02, color: '#2BD576', kind: 'pulse' },
    { t: 39.04, color: '#FF7A1A', kind: 'sweep' },
    { t: 44.70, color: '#FF7A1A', kind: 'impact' },
    { t: 45.98, color: '#FFFFFF', kind: 'sweep' },
    { t: 53.86, color: '#FF7A1A', kind: 'pulse' },
    { t: 58.95, color: '#FF453A', kind: 'sweep' },
    { t: 61.56, color: '#FF7A1A', kind: 'pulse' },
    { t: 63.65, color: '#FFFFFF', kind: 'sweep' },
    { t: 65.55, color: '#2BD576', kind: 'sweep' },
    { t: 67.00, color: '#FF7A1A', kind: 'sweep' },
    { t: 70.44, color: '#FF7A1A', kind: 'pulse' },
    { t: 75.15, color: '#FF7A1A', kind: 'sweep' },
    { t: 78.86, color: '#2BD576', kind: 'pulse' },
    { t: 82.86, color: '#2BD576', kind: 'sweep' },
    { t: 84.62, color: '#2BD576', kind: 'impact' },
    { t: 88.20, color: '#FF7A1A', kind: 'sweep' },
    { t: 90.58, color: '#FF7A1A', kind: 'pulse' },
    { t: 95.04, color: '#2BD576', kind: 'pulse' },
    { t: 97.74, color: '#FF7A1A', kind: 'pulse' },
    { t: 101.76, color: '#FF7A1A', kind: 'sweep' },
    { t: 104.80, color: '#FF7A1A', kind: 'impact' },
    { t: 106.58, color: '#2BD576', kind: 'sweep' },
    { t: 110.72, color: '#FF7A1A', kind: 'sweep' }
  ];

  // Pure deterministic math helpers
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, p) { return a + (b - a) * p; }
  function prog(t, t0, dur) { return clamp((t - t0) / Math.max(0.0001, dur), 0, 1); }
  function easeOutCubic(x) { return 1 - Math.pow(1 - clamp(x, 0, 1), 3); }
  function easeOutQuint(x) { return 1 - Math.pow(1 - clamp(x, 0, 1), 5); }
  function easeOutBack(x) {
    const c1 = 1.70158, c3 = c1 + 1;
    const u = clamp(x, 0, 1);
    return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2);
  }
  function formatBRL(n) {
    return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }
  function fmtClock(t) {
    const s = Math.max(0, Math.floor(t));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
  }

  // Kinetic entry style: scale + blur + slide
  function kin(t, start, dur = 0.28, opts = {}) {
    const p = prog(t, start, dur);
    const e = opts.pop ? easeOutBack(p) : easeOutCubic(p);
    const op = clamp(p * 2.2, 0, 1);
    const dx = lerp(opts.dx || 0, 0, e);
    const dy = lerp(opts.dy !== undefined ? opts.dy : 48, 0, e);
    const sc = lerp(opts.fromScale !== undefined ? opts.fromScale : 0.86, 1.0, e);
    const blur = lerp(opts.blur !== undefined ? opts.blur : 12, 0, easeOutCubic(p));
    return `opacity:${op.toFixed(3)};transform:translate3d(${dx.toFixed(1)}px,${dy.toFixed(1)}px,0) scale(${sc.toFixed(4)});filter:blur(${blur.toFixed(2)}px);`;
  }

  // Fade out envelope at end of a scene
  function envOpacity(t, start, end, fi = 0.14, fo = 0.16) {
    const a = prog(t, start, fi);
    const b = 1 - prog(t, end - fo, fo);
    return clamp(Math.min(a, b), 0, 1);
  }

  // ==================== CUSTOM SVGs ====================

  function svgAI(size = 240, t = 0) {
    const rot = (t * 28) % 360;
    const pulse = 1 + 0.04 * Math.sin(t * 5.0);
    return `
      <svg width="${size}" height="${size}" viewBox="0 0 240 240" fill="none">
        <defs>
          <radialGradient id="aiG" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FF7A1A" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#FF7A1A" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle cx="120" cy="120" r="108" fill="url(#aiG)"/>
        <g transform="translate(120 120) rotate(${rot.toFixed(1)}) translate(-120 -120)">
          <circle cx="120" cy="120" r="88" stroke="#FF7A1A" stroke-width="3.5" stroke-dasharray="16 12" opacity="0.85"/>
          <circle cx="120" cy="32" r="8" fill="#FFFFFF"/>
          <circle cx="208" cy="120" r="7" fill="#2BD576"/>
          <circle cx="120" cy="208" r="8" fill="#FF7A1A"/>
          <circle cx="32" cy="120" r="7" fill="#FFFFFF"/>
        </g>
        <g transform="translate(120 120) rotate(${(-rot * 0.6).toFixed(1)}) translate(-120 -120)">
          <polygon points="120,52 178,86 178,154 120,188 62,154 62,86" stroke="rgba(255,255,255,0.45)" stroke-width="2.5" fill="rgba(17,17,17,0.75)"/>
        </g>
        <g transform="translate(120 120) scale(${pulse.toFixed(3)}) translate(-120 -120)">
          <path d="M120 64 C124 98, 142 116, 176 120 C142 124, 124 142, 120 176 C116 142, 98 124, 64 120 C98 116, 116 98, 120 64 Z" fill="#FF7A1A" stroke="#FFFFFF" stroke-width="3"/>
          <circle cx="120" cy="120" r="14" fill="#111111" stroke="#FFFFFF" stroke-width="3"/>
        </g>
      </svg>`;
  }

  function svgBarber(size = 240, t = 0) {
    const snip = Math.sin(t * 7.5) * 9;
    return `
      <svg width="${size}" height="${size}" viewBox="0 0 240 240" fill="none">
        <rect x="20" y="20" width="200" height="200" rx="38" fill="rgba(17,17,17,0.88)" stroke="#FF7A1A" stroke-width="4"/>
        <!-- Barber pole mini on left -->
        <rect x="46" y="64" width="32" height="112" rx="16" fill="#1C1C1E" stroke="#FFFFFF" stroke-width="3"/>
        <path d="M48 92 L76 76 M48 116 L76 100 M48 140 L76 124 M48 164 L76 148" stroke="#FF7A1A" stroke-width="7" stroke-linecap="round"/>
        <rect x="42" y="54" width="40" height="12" rx="6" fill="#FFFFFF"/>
        <rect x="42" y="174" width="40" height="12" rx="6" fill="#FFFFFF"/>
        <!-- Animated Scissors -->
        <g transform="translate(148 122)">
          <g transform="rotate(${(-24 - snip).toFixed(1)})">

  function renderScene(t) {

      const op = envOpacity(t, 0.0, 2.15, 0.12, 0.14);

          </div>

    }

    // 2) 2.15 - 5.15: HUGE R$ 20.000 -> SLASHED at 4.75s!
    if (t < 5.15) {
      const op = envOpacity(t, 2.15, 5.15, 0.12, 0.14);
      const countP = easeOutCubic(prog(t, 2.16, 0.92));
      const val = Math.round(20000 * countP);
      const slashP = easeOutQuint(prog(t, 4.75, 0.24));
      const slashed = t >= 4.75;
      // Micro shake on impact at 4.75s
      const shakeP = prog(t, 4.75, 0.28);
      const shakeX = slashed && shakeP < 1 ? Math.sin(shakeP * 38) * (1 - shakeP) * 18 : 0;
      const shakeY = slashed && shakeP < 1 ? Math.cos(shakeP * 44) * (1 - shakeP) * 12 : 0;
      const numColor = slashed ? '#8E8E93' : '#FFFFFF';
      const dashLen = 1150;
      const dashOff = Math.round(dashLen * (1 - slashP));

      return `
        <div class="center-stack" style="opacity:${op.toFixed(3)};transform:translate3d(${shakeX.toFixed(1)}px,${shakeY.toFixed(1)}px,0)">
          <div class="eyebrow ${slashed ? 'red' : ''}" style="${kin(t, 2.15, 0.22, { dy: -20 })}">
            ${slashed ? 'ESQUECE ESSE VALOR' : 'CUSTO COM PROGRAMADOR'}

            R$ ${formatBRL(val)}

              <svg class="slash-svg" viewBox="0 0 1100 260" preserveAspectRatio="none">

                  stroke-dasharray="${dashLen}" stroke-dashoffset="${dashOff}" />
              </svg>` : ''}

            <span>PRA FAZER ESSE <span class="orange">APLICATIVO</span></span>

      return `

          <div style="flex:1;text-align:left;">
            <div class="eyebrow green" style="${kin(t, 31.72, 0.24, { dx: -25, dy: 0 })}">MEU PRÓPRIO NEGÓCIO</div>
            <div class="k-title" style="font-size:94px;${kin(t, 31.80, 0.28, { dx: -40, dy: 0 })}">
              APP DA MINHA <span class="orange">ESCOLA</span>
            </div>
            ${showOwn ? `
              <div style="margin-top:34px;${kin(t, 35.95, 0.28, { pop: true, fromScale: 0.8, dy: 22 })}">
                <span class="pill-badge">EU MESMO DESENVOLVI ✓</span>
              </div>` : `
              <div class="k-sub" style="margin-top:26px;${kin(t, 33.40, 0.26, { dy: 24 })}">
                ONDE TRABALHO E SOU DONO
              </div>`}
          </div>
          <div style="${kin(t, 32.00, 0.34, { pop: true, fromScale: 0.8, dy: 0 })}">
            ${svgPhoneApp(290, { badge: 'ESCOLA DE MÚSICA', title: 'APP PRÓPRIO' })}
          </div>
        </div>`;
    }

    // 13) 39.04 - 45.98: A possibilidade que a IA dá de criar QUALQUER COISA
    if (t < 45.98) {
      const op = envOpacity(t, 39.04, 45.98, 0.14, 0.16);
      const climax = t >= 44.55;
      return `
        <div class="center-stack" style="opacity:${op.toFixed(3)}">
          <div style="margin-bottom:20px;${kin(t, 39.15, 0.34, { pop: true, fromScale: 0.72, dy: -20 })}">
            ${svgAI(210, t)}
          </div>
          <div class="k-sub" style="margin-top:0;font-size:50px;${kin(t, 41.20, 0.26, { dy: 26 })}">
            A POSSIBILIDADE QUE A <span class="orange">IA</span> DÁ DE CRIAR
          </div>
          ${climax ? `
            <div class="k-mega orange" style="margin-top:16px;font-size:158px;${kin(t, 44.65, 0.26, { pop: true, fromScale: 0.68, dy: 22 })}">
              QUALQUER COISA
            </div>` : `
            <div class="k-title" style="margin-top:18px;font-size:102px;${kin(t, 43.00, 0.26, { dy: 34 })}">
              BASICAMENTE...
            </div>`}
        </div>`;
    }

    // 14) 45.98 - 53.86: Igreja · Vários empresários
    if (t < 53.86) {
      const op = envOpacity(t, 45.98, 53.86, 0.14, 0.16);
      return `
        <div class="split-layout" style="opacity:${op.toFixed(3)}">
          <div style="flex:1;text-align:left;">
            <div class="eyebrow" style="${kin(t, 46.08, 0.24, { dx: -24, dy: 0 })}">COMO SURGIU O CLIENTE</div>
            <div class="k-title" style="font-size:94px;${kin(t, 48.70, 0.28, { dx: -40, dy: 0 })}">
              COMUNIDADE DE <span class="orange">EMPRESÁRIOS</span>
            </div>
            <div class="k-sub" style="margin-top:24px;${kin(t, 50.80, 0.28, { dy: 28 })}">
              NETWORKING REAL NA MINHA IGREJA
            </div>
            <div class="accent-line" style="margin:26px 0;width:${Math.round(lerp(0, 480, easeOutCubic(prog(t, 51.00, 0.45))))}px;"></div>
          </div>
          <div style="${kin(t, 48.80, 0.34, { pop: true, fromScale: 0.8, dy: 0 })}">
            ${svgNetwork(310, t)}
          </div>
        </div>`;
    }

    // 15) 53.86 - 58.95: Um empresário próximo de mim
    if (t < 58.95) {
      const op = envOpacity(t, 53.86, 58.95, 0.14, 0.16);
      return `
        <div class="center-stack" style="opacity:${op.toFixed(3)}">
          <div class="eyebrow" style="${kin(t, 53.95, 0.24, { dy: -20 })}">OPORTUNIDADE REAL</div>
          <div class="k-title" style="font-size:108px;${kin(t, 54.90, 0.28, { pop: true, dy: 40 })}">
            UM <span class="orange">EMPRESÁRIO</span><br/>PRÓXIMO DE MIM
          </div>
          <div class="accent-line" style="width:${Math.round(lerp(0, 560, easeOutCubic(prog(t, 55.20, 0.50))))}px;"></div>
        </div>`;
    }

    // 16) 58.95 - 63.65: Problemas no aplicativo de barbearia (Tesoura + Celular Alert)
    if (t < 63.65) {
      const op = envOpacity(t, 58.95, 63.65, 0.12, 0.14);
      return `
        <div class="split-layout" style="opacity:${op.toFixed(3)}">
          <div style="flex:1;text-align:left;">
            <div class="eyebrow red" style="${kin(t, 59.00, 0.24, { dx: -24, dy: 0 })}">A DOR DO CLIENTE</div>
            <div class="k-title" style="font-size:94px;${kin(t, 59.10, 0.28, { dx: -40, dy: 0 })}">
              <span class="red">PROBLEMAS</span> NO APP<br/>DE <span class="orange">BARBEARIA</span>
            </div>
            <div style="margin-top:30px;display:flex;align-items:center;gap:24px;${kin(t, 61.50, 0.28, { pop: true, dy: 24 })}">
              ${svgBarber(145, t)}
              <div style="font-size:38px;font-weight:800;color:#E4E4E7;">SISTEMA TRAVANDO<br/>E SEM MARCA PRÓPRIA</div>
            </div>
          </div>
          <div style="${kin(t, 59.60, 0.34, { pop: true, fromScale: 0.78, dy: 0 })}">
            ${svgPhoneApp(280, { badge: 'PROBLEMA', title: 'APP ANTIGO', alert: true })}
          </div>
        </div>`;
    }

    // 17) 63.65 - 65.55: RELANCE 3 (FACE CLEAR!) — "Cara, eu posso te ajudar!"
    if (t < 65.55) {
      const op = envOpacity(t, 63.65, 65.55, 0.10, 0.14);
      return `
        <div class="relance-bottom" style="opacity:${op.toFixed(3)}">
          <div class="relance-bar" style="${kin(t, 63.75, 0.24, { pop: true, dy: 40 })}">
            <span class="relance-text">“EU POSSO TE <span class="orange">AJUDAR</span>”</span>
          </div>
        </div>`;
    }

    // 18) 65.55 - 67.00: "Fazer um app pra você"
    if (t < 67.00) {
      const op = envOpacity(t, 65.55, 67.00, 0.10, 0.12);
      return `
        <div class="split-layout" style="opacity:${op.toFixed(3)}">
          <div style="flex:1;text-align:left;">
            <div class="eyebrow green" style="${kin(t, 65.58, 0.20, { dx: -20, dy: 0 })}">A PROPOSTA</div>
            <div class="k-title" style="font-size:100px;${kin(t, 65.62, 0.24, { pop: true, dx: -30, dy: 0 })}">
              FAZER UM <span class="green">APP</span><br/>PRA VOCÊ
            </div>
          </div>
          <div style="${kin(t, 65.62, 0.26, { pop: true, fromScale: 0.82, dy: 0 })}">
            ${svgPhoneApp(270, { badge: 'SOB MEDIDA', title: 'SAMUEL BARBEARIA' })}
          </div>
        </div>`;
    }

    // 19) 67.00 - 75.15: Não comecei agora — bons meses programando com IA + MacBook 2014
    if (t < 75.15) {
      const op = envOpacity(t, 67.00, 75.15, 0.14, 0.16);
      const barP = easeOutCubic(prog(t, 70.44, 2.2));
      return `
        <div class="split-layout" style="opacity:${op.toFixed(3)}">
          <div style="flex:1;text-align:left;">
            <div class="eyebrow" style="${kin(t, 67.05, 0.24, { dx: -24, dy: 0 })}">PONTO IMPORTANTE</div>
            <div class="k-title" style="font-size:90px;${kin(t, 69.00, 0.28, { dx: -40, dy: 0 })}">
              EU <span class="orange">NÃO COMECEI</span><br/>AGORA
            </div>
            <div class="k-sub" style="margin-top:22px;${kin(t, 70.44, 0.28, { dy: 28 })}">
              <span class="green">BONS MESES</span> PROGRAMANDO COM IA
            </div>
            <div style="margin-top:26px;width:680px;height:14px;border-radius:999px;background:rgba(255,255,255,0.14);overflow:hidden;${kin(t, 70.44, 0.24, { dy: 16 })}">
              <div style="height:100%;width:${Math.round(barP * 100)}%;background:linear-gradient(90deg,#FF7A1A,#2BD576);"></div>
            </div>
          </div>
          <div style="${kin(t, 68.50, 0.36, { pop: true, fromScale: 0.8, dy: 0 })}">
            ${svgMacBook2014(520, t)}
          </div>
        </div>`;
    }

    // 20) 75.15 - 82.86: Não foi só sair fazendo — já sabia construir
    if (t < 82.86) {
      const op = envOpacity(t, 75.15, 82.86, 0.14, 0.16);
      const phase2 = t >= 78.80;
      return `
        <div class="center-stack" style="opacity:${op.toFixed(3)}">
          <div class="eyebrow ${phase2 ? 'green' : ''}" style="${kin(t, 75.25, 0.24, { dy: -20 })}">
            ${phase2 ? 'MÉTODO & EXPERIÊNCIA' : 'SEM IMPROVISO'}
          </div>
          ${!phase2 ? `
            <div class="k-title" style="font-size:104px;${kin(t, 75.36, 0.28, { dy: 40 })}">
              NÃO FOI SÓ<br/><span class="orange">SAIR FAZENDO</span>
            </div>` : `
            <div class="k-title" style="font-size:106px;${kin(t, 78.86, 0.28, { pop: true, dy: 40 })}">
              EU JÁ SABIA<br/><span class="green">CONSTRUIR</span>
            </div>
            <div class="accent-line green" style="width:${Math.round(lerp(0, 560, easeOutCubic(prog(t, 79.10, 0.45))))}px;"></div>
            <div class="k-sub" style="${kin(t, 80.20, 0.26, { dy: 24 })}">EXATAMENTE O QUE O CLIENTE PRECISAVA</div>`}
        </div>`;
    }

    // 21) 82.86 - 88.20: FECHEI COM ELE — APP DA BARBEARIA!
    if (t < 88.20) {
      const op = envOpacity(t, 82.86, 88.20, 0.12, 0.16);
      return `
        <div class="split-layout" style="opacity:${op.toFixed(3)}">
          <div style="flex:1;text-align:left;">
            <div class="eyebrow green" style="${kin(t, 83.00, 0.24, { dx: -24, dy: 0 })}">PRIMEIRA VENDA</div>
            <div class="k-mega green" style="font-size:126px;${kin(t, 84.55, 0.28, { pop: true, fromScale: 0.72, dy: 24 })}">
              FECHEI<br/>COM ELE!
            </div>
            <div class="k-sub" style="margin-top:22px;${kin(t, 86.10, 0.28, { dy: 24 })}">
              O APP DA <span class="orange">BARBEARIA DO SAMUEL</span>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:28px;${kin(t, 84.70, 0.34, { pop: true, fromScale: 0.78, dy: 0 })}">
            ${svgBarber(220, t)}
            ${svgPhoneApp(240, { badge: 'FECHADO ✓', title: 'SAMUEL BARBEARIA' })}
          </div>
        </div>`;
    }

    // 22) 88.20 - 101.76: PROMESSA DO VÍDEO (Checklist: Quanto gastei / Quanto vendi / Serviços / Como fiz)
    if (t < 101.76) {
      const op = envOpacity(t, 88.20, 101.76, 0.14, 0.16);
      const s1 = t >= 90.40;
      const s2 = t >= 94.95;
      const s3 = t >= 97.65;
      const s4 = t >= 100.40;
      return `
        <div class="center-stack" style="opacity:${op.toFixed(3)}">
          <div class="eyebrow" style="${kin(t, 88.30, 0.24, { dy: -20 })}">TUDO ABERTAMENTE NA TELA</div>
          <div class="k-title" style="font-size:82px;${kin(t, 88.45, 0.26, { dy: 30 })}">
            O QUE VOCÊ VAI VER <span class="orange">NESTE VÍDEO</span>
          </div>
          <div class="promise-grid">
            <div class="promise-item ${s1 && !s2 ? 'active' : ''}" style="${s1 ? kin(t, 90.45, 0.28, { pop: true, dy: 30 }) : 'opacity:0.18;'}">
              <div class="promise-num">01</div>
              <div>
                <div class="promise-lbl">QUANTO GASTEI</div>
                <div class="promise-val orange">~R$ 100 em IA</div>
              </div>
            </div>
            <div class="promise-item ${s2 && !s3 ? 'active-green' : ''}" style="${s2 ? kin(t, 95.00, 0.28, { pop: true, dy: 30 }) : 'opacity:0.18;'}">
              <div class="promise-num green">02</div>
              <div>
                <div class="promise-lbl">POR QUANTO VENDI</div>
                <div class="promise-val green">R$ 1.500 + R$ 100/mês</div>
              </div>
            </div>
            <div class="promise-item ${s3 && !s4 ? 'active' : ''}" style="${s3 ? kin(t, 97.70, 0.28, { pop: true, dy: 30 }) : 'opacity:0.18;'}">
              <div class="promise-num">03</div>
              <div>
                <div class="promise-lbl">QUAIS SERVIÇOS</div>
                <div class="promise-val muted">Cloudflare · Supabase · Asaas</div>
              </div>
            </div>
            <div class="promise-item ${s4 ? 'active-green' : ''}" style="${s4 ? kin(t, 100.45, 0.28, { pop: true, dy: 30 }) : 'opacity:0.18;'}">
              <div class="promise-num green">04</div>
              <div>
                <div class="promise-lbl">COMO FIZ O APP</div>
                <div class="promise-val green">Passo a passo real</div>
              </div>
            </div>
          </div>
        </div>`;
    }

    // 23) 101.76 - 106.58: Quais sites, quais servidores — VOCÊ VAI ENTENDER TUDO!
    if (t < 106.58) {
      const op = envOpacity(t, 101.76, 106.58, 0.12, 0.14);
      const tudo = t >= 104.40;
      const pulse = tudo ? (1 + 0.04 * Math.sin((t - 104.4) * 18)) : 1;
      return `
        <div class="center-stack" style="opacity:${op.toFixed(3)}">
          ${!tudo ? `
            <div class="eyebrow" style="${kin(t, 101.82, 0.22, { dy: -20 })}">INFRAESTRUTURA COMPLETA</div>
            <div class="k-title" style="font-size:96px;${kin(t, 101.88, 0.26, { dy: 34 })}">
              SITES &amp; <span class="orange">SERVIDORES</span>
            </div>
            <div class="chip-row">
              <span class="chip green" style="${kin(t, 102.00, 0.24, { pop: true, dy: 24 })}">CLOUDFLARE · R$ 0</span>
              <span class="chip green" style="${kin(t, 102.35, 0.24, { pop: true, dy: 24 })}">SUPABASE · R$ 0</span>
              <span class="chip" style="${kin(t, 102.75, 0.24, { pop: true, dy: 24 })}">CLAUDE IA</span>
              <span class="chip green" style="${kin(t, 103.15, 0.24, { pop: true, dy: 24 })}">GITHUB · GRÁTIS</span>
            </div>` : `
            <div class="k-sub" style="margin-top:0;font-size:52px;${kin(t, 104.35, 0.20, { dy: 20 })}">VOCÊ VAI ENTENDER</div>
            <div style="transform:scale(${pulse.toFixed(3)});">
              <div class="k-mega orange" style="font-size:210px;${kin(t, 104.60, 0.24, { pop: true, fromScale: 0.65, dy: 16 })}">
                TUDO!
              </div>
            </div>
            <div class="accent-line" style="width:${Math.round(lerp(0, 620, easeOutCubic(prog(t, 104.70, 0.40))))}px;"></div>`}
        </div>`;
    }

    // 24) 106.58 - 111.00: Pode ser um NEGÓCIO pra você — PROGRAMAÇÃO COM IA -> clean fade out
    if (t < OPENING_DUR) {
      const op = envOpacity(t, 106.58, OPENING_DUR, 0.14, 0.30);
      return `
        <div class="split-layout" style="opacity:${op.toFixed(3)}">
          <div style="flex:1;text-align:left;">
            <div class="eyebrow green" style="${kin(t, 106.66, 0.22, { dx: -24, dy: 0 })}">OPORTUNIDADE REAL</div>
            <div class="k-title" style="font-size:94px;${kin(t, 106.74, 0.28, { pop: true, dx: -36, dy: 0 })}">
              PODE SER UM<br/><span class="green">NEGÓCIO</span> PRA VOCÊ
            </div>
            <div class="k-sub" style="margin-top:24px;font-size:48px;${kin(t, 108.60, 0.26, { dy: 26 })}">
              COM <span class="orange">PROGRAMAÇÃO COM IA</span>
            </div>
          </div>
          <div style="${kin(t, 107.20, 0.34, { pop: true, fromScale: 0.78, dy: 0 })}">
            ${svgAI(340, t)}
          </div>
        </div>`;
    }

    return '';
  }

  // ==================== GLOBAL DETERMINISTIC SEEK ====================
  const bgWash = document.getElementById('bg-wash');
  const bgGrid = document.getElementById('bg-grid');
  const ambientGlow = document.getElementById('ambient-glow');
  const sceneRoot = document.getElementById('scene-root');
  const hud = document.getElementById('hud');
  const hudCounter = document.getElementById('hud-counter');
  const progressFill = document.getElementById('progress-fill');
  const flashLayer = document.getElementById('flash-layer');
  const sweepBar = document.getElementById('sweep-bar');

  window.seek = function (t) {
    t = Number(t) || 0;

    if (t < 0 || t >= OPENING_DUR) {
      bgWash.style.opacity = '0';
      bgGrid.style.opacity = '0';
      ambientGlow.style.opacity = '0';
      hud.style.opacity = '0';
      sceneRoot.innerHTML = '';
      flashLayer.style.opacity = '0';
      sweepBar.style.opacity = '0';
      return;
    }

    // Check if inside one of the short face relances
    let inRelance = false;
    for (let i = 0; i < RELANCES.length; i++) {
      if (t >= RELANCES[i][0] && t < RELANCES[i][1]) {
        inRelance = true;
        break;
      }
    }

    // Global fade-out right before 111.0s
    const endFade = 1 - prog(t, OPENING_DUR - 0.32, 0.32);

    // Background scrim & grid: active over B-roll, 0% over face relances so face is 100% crisp!
    bgWash.style.opacity = inRelance ? '0' : (0.95 * endFade).toFixed(3);
    bgGrid.style.opacity = inRelance ? '0' : (0.85 * endFade).toFixed(3);
    ambientGlow.style.opacity = inRelance ? '0' : (0.90 * endFade).toFixed(3);

    // Subtle drift of ambient glow
    const gx = 410 + Math.sin(t * 0.65) * 180;
    const gy = -40 + Math.cos(t * 0.48) * 100;
    ambientGlow.style.left = gx.toFixed(1) + 'px';
    ambientGlow.style.top = gy.toFixed(1) + 'px';

    // HUD stays sleek over B-roll and subtly dims on face relances
    hud.style.opacity = (inRelance ? 0.38 : 0.92 * endFade).toFixed(3);
    hudCounter.textContent = fmtClock(t) + ' / 01:51';
    progressFill.style.width = (clamp(t / OPENING_DUR, 0, 1) * 100).toFixed(2) + '%';

    // Render active beat
    sceneRoot.innerHTML = renderScene(t);

    // Deterministic Flash / Sweep transitions
    let flashOp = 0;
    let flashColor = '#FF7A1A';
    let sweepOp = 0;
    let sweepX = -500;
    let sweepColor = '#FF7A1A';

    for (let i = 0; i < FLASH_BEATS.length; i++) {
      const fb = FLASH_BEATS[i];
      const dt = t - fb.t;
      if (dt >= 0 && dt < 0.28) {
        if (fb.kind === 'impact') {
          const p = dt / 0.26;
          flashOp = Math.max(flashOp, (1 - p) * (1 - p) * 0.42);
          flashColor = fb.color;
        } else if (fb.kind === 'pulse') {
          const p = dt / 0.20;
          if (p <= 1) {
            flashOp = Math.max(flashOp, (1 - p) * 0.16);
            flashColor = fb.color;
          }
        } else if (fb.kind === 'sweep') {
          const p = dt / 0.26;
          if (p <= 1) {
            sweepOp = Math.sin(p * Math.PI) * 0.85;
            sweepX = lerp(-420, 2240, easeOutCubic(p));
            sweepColor = fb.color;
          }
        }
      }
    }

    flashLayer.style.opacity = flashOp.toFixed(3);
    flashLayer.style.background = `radial-gradient(circle at 50% 50%, ${flashColor}, transparent 78%)`;

    sweepBar.style.opacity = sweepOp.toFixed(3);
    sweepBar.style.left = sweepX.toFixed(1) + 'px';
    sweepBar.style.background = `linear-gradient(90deg, transparent 0%, ${sweepColor} 46%, #FFFFFF 54%, transparent 100%)`;
  };

  // Initial deterministic frame at t=0
  window.seek(0);
})();
</script>
</body>
